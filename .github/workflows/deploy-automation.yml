name: Deploy ServiceNow Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy automation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/snow-automation-stack.yaml \
            --stack-name devops-agent-snow-automation \
            --parameter-overrides \
              SnowInstance=${{ secrets.SNOW_INSTANCE }} \
              SnowUsername=${{ secrets.SNOW_USERNAME }} \
              SnowPassword=${{ secrets.SNOW_PASSWORD }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
